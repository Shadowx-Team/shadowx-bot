<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;family=Inter:wght@600;800;900&amp;display=swap');
      .title { font-family: 'Inter', sans-serif; font-weight: 900; letter-spacing: -0.5px; }
      .sub { font-family: 'Inter', sans-serif; font-weight: 600; }
      .code { font-family: 'Fira Code', monospace; font-weight: 700; }
    </style>
    
    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#BC8CFF;#3FB950;#58A6FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#BC8CFF">
        <animate attributeName="stop-color" values="#BC8CFF;#3FB950;#58A6FF;#BC8CFF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3FB950">
        <animate attributeName="stop-color" values="#3FB950;#58A6FF;#BC8CFF;#3FB950" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Pulsing Background Glow -->
    <radialGradient id="bgGlow" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.25;0.08;0.25" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base & Glow -->
  <rect width="1000" height="300" rx="16" fill="#0D1117"/>
  <rect width="1000" height="300" rx="16" fill="url(#bgGlow)"/>
  <rect width="1000" height="300" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Online Status Indicator -->
  <g transform="translate(850, 40)">
    <rect width="90" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
    <circle cx="18" cy="14" r="4" fill="#3FB950" filter="url(#glowFilter)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" class="code" font-size="10" fill="#3FB950">ONLINE</text>
  </g>

  <!-- Title & Subtitle with Color Shimmer -->
  <text x="60" y="85" class="title" font-size="34" fill="#58A6FF" filter="url(#glowFilter)">
    Mueid Mursalin Rifat
    <animate attributeName="fill" values="#58A6FF;#BC8CFF;#3FB950;#58A6FF" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="60" y="120" class="sub" font-size="16" fill="#8B949E">Creator of ShadowX-Bot • API Architect • Bangladesh 🇧🇩</text>

  <!-- Card 1: Main Project -->
  <g transform="translate(60, 160)">
    <rect width="270" height="90" rx="10" fill="#161B22" stroke="#30363D">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="32" class="code" font-size="11" fill="#8B949E">MAIN PROJECT</text>
    <text x="20" y="62" class="title" font-size="18" fill="#3FB950" filter="url(#glowFilter)">ShadowX-Bot</text>
  </g>

  <!-- Card 2: Speciality -->
  <g transform="translate(350, 160)">
    <rect width="270" height="90" rx="10" fill="#161B22" stroke="#30363D">
      <animate attributeName="stroke" values="#30363D;#D29922;#30363D" dur="6s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="32" class="code" font-size="11" fill="#8B949E">SPECIALITY</text>
    <text x="20" y="62" class="title" font-size="18" fill="#D29922">APIs &amp; Automation</text>
  </g>

  <!-- Card 3: Stack Badges -->
  <g transform="translate(640, 160)">
    <rect width="300" height="90" rx="10" fill="#161B22" stroke="#30363D">
      <animate attributeName="stroke" values="#30363D;#BC8CFF;#30363D" dur="6s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="32" class="code" font-size="11" fill="#8B949E">PRIMARY STACK</text>
    
    <!-- Node.js Badge -->
    <g transform="translate(20, 44)">
      <rect width="72" height="24" rx="6" fill="#238636" fill-opacity="0.2" stroke="#238636"/>
      <text x="36" y="16" text-anchor="middle" class="code" font-size="11" fill="#3FB950">Node.js</text>
    </g>
    
    <!-- Python Badge -->
    <g transform="translate(100, 44)">
      <rect width="68" height="24" rx="6" fill="#1F6FEB" fill-opacity="0.2" stroke="#1F6FEB"/>
      <text x="34" y="16" text-anchor="middle" class="code" font-size="11" fill="#58A6FF">Python</text>
    </g>

    <!-- Railway Badge -->
    <g transform="translate(176, 44)">
      <rect width="72" height="24" rx="6" fill="#8E44AD" fill-opacity="0.2" stroke="#8E44AD"/>
      <text x="36" y="16" text-anchor="middle" class="code" font-size="11" fill="#BC8CFF">Railway</text>
    </g>
  </g>
</svg>
