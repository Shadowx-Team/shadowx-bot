<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Inter:wght@600;800;900&amp;display=swap');
      .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 900; letter-spacing: -0.5px; }
      .sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 500; }
      .code { font-family: 'Fira Code', monospace; }
    </style>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="orbBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04">
        <animate attributeName="stroke-opacity" values="0.03;0.07;0.03" dur="4s" repeatCount="indefinite"/>
      </path>
    </pattern>
    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <linearGradient id="baseBorderGrad" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="50%" stop-color="#21262D"/>
      <stop offset="100%" stop-color="#30363D"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" rx="18" fill="#090D13"/>
  <g>
    <circle cx="220" cy="90" r="130" fill="#1F6FEB" filter="url(#orbBlur)" opacity="0.25">
      <animateTransform attributeName="transform" type="translate" values="0,0; 50,30; -30,20; 0,0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="180" r="140" fill="#8957E5" filter="url(#orbBlur)" opacity="0.22">
      <animateTransform attributeName="transform" type="translate" values="0,0; -40,-30; 30,-20; 0,0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="240" r="100" fill="#238636" filter="url(#orbBlur)" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" values="0,0; -30,-40; 40,20; 0,0" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect width="1000" height="300" rx="18" fill="url(#cyberGrid)"/>
  <rect width="1000" height="300" rx="18" fill="none" stroke="url(#baseBorderGrad)" stroke-width="1.5"/>
  <rect width="1000" height="300" rx="18" fill="none" 
        stroke="url(#laserBeamGrad)" 
        stroke-width="2.5" 
        stroke-dasharray="200 2400" 
        stroke-dashoffset="0" 
        filter="url(#laserGlow)">
    <animate attributeName="stroke-dashoffset" values="0; -2600" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(60, 48)">
    <text class="code" font-size="12" font-weight="500" fill="#58A6FF">~/mueid-mursalin <tspan fill="#8B949E">(main)</tspan> <tspan fill="#3FB950">$</tspan></text>
  </g>
  <g transform="translate(850, 36)">
    <rect width="90" height="30" rx="15" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    <circle cx="18" cy="15" r="4" fill="none" stroke="#3FB950" stroke-width="1.5" opacity="1">
      <animate attributeName="r" values="4; 11" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9; 0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="15" r="4" fill="#3FB950" filter="url(#laserGlow)"/>
    <text x="32" y="19" class="code" font-size="10" font-weight="700" fill="#3FB950" letter-spacing="0.5">ONLINE</text>
  </g>
  <text x="60" y="98" class="title" font-size="35" fill="#58A6FF" filter="url(#laserGlow)">
    Mueid Mursalin Rifat
    <animate attributeName="fill" values="#58A6FF; #BC8CFF; #3FB950; #58A6FF" dur="8s" repeatCount="indefinite"/>
  </text>
  <rect x="460" y="73" width="3" height="28" fill="#58A6FF" rx="1.5">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="130" class="sub" font-size="15" fill="#8B949E">
    Creator of <tspan fill="#E6EDF3" font-weight="600">ShadowX-Bot</tspan> • API Architect • Automation Engineer • Bangladesh 🇧🇩
  </text>
  <g transform="translate(60, 165)">
    <rect width="270" height="92" rx="12" fill="#161B22" fill-opacity="0.8" stroke="#30363D" stroke-width="1">
      <animate attributeName="stroke" values="#30363D;#3FB950;#30363D" dur="5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="25" cy="30" r="3" fill="#3FB950"/>
    <text x="36" y="34" class="code" font-size="10.5" font-weight="500" fill="#8B949E" letter-spacing="0.5">MAIN PROJECT</text>
    <text x="25" y="66" class="title" font-size="19" fill="#3FB950" filter="url(#laserGlow)">ShadowX-Bot</text>
    <rect x="180" y="50" width="46" height="20" rx="6" fill="#3FB950" fill-opacity="0.12" stroke="#3FB950" stroke-width="0.8"/>
    <text x="203" y="64" text-anchor="middle" class="code" font-size="9.5" fill="#3FB950">v2.5</text>
  </g>
  <g transform="translate(350, 165)">
    <rect width="270" height="92" rx="12" fill="#161B22" fill-opacity="0.8" stroke="#30363D" stroke-width="1">
      <animate attributeName="stroke" values="#30363D;#D29922;#30363D" dur="5s" begin="1.7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="25" cy="30" r="3" fill="#D29922"/>
    <text x="36" y="34" class="code" font-size="10.5" font-weight="500" fill="#8B949E" letter-spacing="0.5">SPECIALITY</text>
    <text x="25" y="66" class="title" font-size="18" fill="#F0883E">Fast Response &amp; Multi-Acc</text>
  </g>
  <g transform="translate(640, 165)">
    <rect width="300" height="92" rx="12" fill="#161B22" fill-opacity="0.8" stroke="#30363D" stroke-width="1">
      <animate attributeName="stroke" values="#30363D;#BC8CFF;#30363D" dur="5s" begin="3.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="25" cy="30" r="3" fill="#BC8CFF"/>
    <text x="36" y="34" class="code" font-size="10.5" font-weight="500" fill="#8B949E" letter-spacing="0.5">PRIMARY STACK</text>
    <g transform="translate(22, 48)">
      <rect width="76" height="26" rx="6" fill="#238636" fill-opacity="0.15" stroke="#238636" stroke-width="1"/>
      <text x="38" y="17" text-anchor="middle" class="code" font-size="11" font-weight="700" fill="#3FB950">Node.js</text>
    </g>
    <g transform="translate(106, 48)">
      <rect width="72" height="26" rx="6" fill="#1F6FEB" fill-opacity="0.15" stroke="#1F6FEB" stroke-width="1"/>
      <text x="36" y="17" text-anchor="middle" class="code" font-size="11" font-weight="700" fill="#58A6FF">Neondb</text>
    </g>
    <g transform="translate(186, 48)">
      <rect width="76" height="26" rx="6" fill="#8E44AD" fill-opacity="0.15" stroke="#BC8CFF" stroke-width="1"/>
      <text x="38" y="17" text-anchor="middle" class="code" font-size="11" font-weight="700" fill="#BC8CFF">Shadowx-fca</text>
    </g>
  </g>
</svg>
